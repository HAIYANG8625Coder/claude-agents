<!doctype html>
<!-- HOOK CARD: one big question or statement. Style: dark gradient "quote card" (popular for opinions, questions, "let's connect"). -->
<html><head><meta charset="utf-8"><meta name="x-size" content="1600x900">
<link rel="stylesheet" href="../../.claude/skills/x-image/templates/brand.css">
<style>
  html, body { width: 1600px; height: 900px; }
  .wrap { padding: 96px 110px; }
  .kicker { font-size: 30px; }
  h1 { margin-top: 36px; font-size: 104px; line-height: 1.05; font-weight: 800; letter-spacing: -2.5px; max-width: 1300px; }
  .chips { margin-top: 56px; display: flex; gap: 18px; flex-wrap: wrap; font-size: 30px; }

<div class="bg"></div><div class="grid"></div>

  </div>
  <div class="foot"><div><b>Programmer in Singapore</b> · learning AI agents in public</div><div class="dots"><i></i><i></i><i></i></div></div>
</div>
