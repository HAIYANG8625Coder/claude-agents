<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="470" fill="#0d1117"/>
  <rect x="30" y="30" width="1140" height="410" rx="16" fill="#1c1a17"/>
  <text x="60" y="76" font-size="21" font-weight="700" fill="#ece8e1">One note's first 24 hours</text>
  <text x="60" y="102" font-size="15" fill="#aca69d">A tick every 10 min checks for work. Most ticks find none and spend no tokens. A run only starts when something is due.</text>

  <!-- axis: Sun 09:00 (x=80) to Mon 23:00 (x=1120), 38 h, 27.37 px/h -->
  <line x1="96" y1="250" x2="1120" y2="250" stroke="#4d4842" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round"/>
  <!-- day labels -->
  <text x="60" y="256" font-size="14" font-weight="700" fill="#aca69d">Sun</text>
  <line x1="490" y1="238" x2="490" y2="262" stroke="#4d4842" stroke-width="2"/>
  <text x="490" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#aca69d">Mon 00:00</text>

  <!-- sleep labels -->
  <text x="304" y="240" text-anchor="middle" font-size="14" fill="#7f7a72">asleep · 0 tokens</text>
  <text x="640" y="240" text-anchor="middle" font-size="14" fill="#7f7a72">asleep · 0 tokens</text>
  <text x="935" y="240" text-anchor="middle" font-size="14" fill="#7f7a72">asleep · 0 tokens</text>

  <!-- publish 09:58 (x=106) -->
  <circle cx="100" cy="250" r="9" fill="#ece8e1"/>
  <text x="84" y="320" font-size="15" font-weight="700" fill="#ece8e1">09:58 published</text>

  <!-- run 1: 10:12 check (x=113) -->
  <rect x="114" y="226" width="16" height="48" rx="4" fill="#f0883e"/>
  <line x1="122" y1="222" x2="122" y2="170" stroke="#f0883e" stroke-width="2"/>
  <text x="130" y="140" font-size="15" font-weight="700" fill="#f0883e">10:12 run · your check</text>
  <text x="130" y="160" font-size="14" fill="#b8b2a9">under 24 h: sets a follow-up</text>

  <!-- run 2: Sun 21:15 digest (x=416) -->
  <rect x="408" y="226" width="16" height="48" rx="4" fill="#f0883e"/>
  <line x1="416" y1="278" x2="416" y2="342" stroke="#f0883e" stroke-width="2"/>
  <text x="416" y="364" text-anchor="middle" font-size="15" font-weight="700" fill="#f0883e">21:15 run · digest</text>
  <text x="416" y="384" text-anchor="middle" font-size="14" fill="#b8b2a9">nothing new: stays quiet</text>

  <!-- run 3: Mon 10:08 follow-up (x=767) -->
  <rect x="759" y="220" width="18" height="60" rx="4" fill="#f0883e"/>
  <line x1="768" y1="216" x2="768" y2="170" stroke="#f0883e" stroke-width="2"/>
  <text x="768" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#f0883e">10:08 run · follow-up (24 h + 10 min)</text>
  <text x="768" y="160" text-anchor="middle" font-size="14" fill="#b8b2a9">reads the stats, writes a line to stats.md</text>
  <rect x="620" y="304" width="296" height="58" rx="10" fill="#2a2723" stroke="#4a4640" stroke-width="1.5"/>
  <text x="768" y="328" text-anchor="middle" font-size="13.5" fill="#ece8e1">alert now only if views ≥ 2× or ≤ ½</text>
  <text x="768" y="348" text-anchor="middle" font-size="13.5" fill="#ece8e1">the median; otherwise wait for the digest</text>
  <line x1="768" y1="282" x2="768" y2="302" stroke="#f0883e" stroke-width="2"/>

  <!-- run 4: Mon 21:15 digest (x=1069) -->
  <rect x="1061" y="226" width="16" height="48" rx="4" fill="#f0883e"/>
  <line x1="1069" y1="278" x2="1069" y2="342" stroke="#f0883e" stroke-width="2"/>
  <text x="1110" y="364" text-anchor="end" font-size="15" font-weight="700" fill="#f0883e">21:15 run · digest</text>
  <text x="1110" y="384" text-anchor="end" font-size="14" fill="#b8b2a9">sends the new line to Telegram</text>

  <text x="60" y="420" font-size="14" fill="#aca69d">Then the next /xhs-post copies the line from stats.md into posts.md.</text>
</svg>
