<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker><marker id="aaccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d4600b"/></marker><marker id="agrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8a49c"/></marker></defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="50" font-size="21" font-weight="700" fill="#1f1f1f">Decision · which voice and face a video gets</text>
  <rect x="470" y="90" width="260" height="70" rx="10" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
  <text x="600" y="119.9" font-size="20" font-weight="700" fill="#1f1f1f" text-anchor="middle">/avatar-video topic</text>
  <text x="600" y="149.9" font-size="14" font-weight="400" fill="#6b6b6b" text-anchor="middle">you start a video</text>
  <path d="M600,164 L600,206" fill="none" stroke="#1f1f1f" stroke-width="2" marker-end="url(#aink)"/>
  <rect x="440" y="210" width="320" height="70" rx="9" fill="#1f1f1f" stroke="#1f1f1f" stroke-width="0"/>
  <text x="600" y="251" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">avatar_look_id set?</text>
  <path d="M436,245 L262,245 Q250,245 250,257 L250,316" fill="none" stroke="#1f1f1f" stroke-width="2" marker-end="url(#aink)"/>
  <text x="340" y="233" font-size="15" font-weight="700" fill="#1f1f1f" text-anchor="middle">yes</text>
  <path d="M764,245 L938,245 Q950,245 950,257 L950,316" fill="none" stroke="#d4600b" stroke-width="2.5" marker-end="url(#aaccent)"/>
  <text x="860" y="233" font-size="15" font-weight="700" fill="#d4600b" text-anchor="middle">no (today)</text>
  <rect x="120" y="320" width="260" height="96" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="250" y="353.5" font-size="19" font-weight="700" fill="#d4600b" text-anchor="middle">Avatar mode</text>
  <text x="250" y="382.2" font-size="14" font-weight="400" fill="#6b6b6b" text-anchor="middle">your face, lip-synced</text>
  <text x="250" y="400.4" font-size="14" font-weight="400" fill="#6b6b6b" text-anchor="middle">to the voice · paid</text>
  <rect x="814" y="314" width="272" height="108" rx="12" fill="#e9c9ae"/>
  <rect x="820" y="320" width="260" height="96" rx="9" fill="#fcefe5" stroke="#d4600b" stroke-width="2.5"/>
  <text x="950" y="362.6" font-size="19" font-weight="700" fill="#d4600b" text-anchor="middle">No-avatar mode</text>
  <text x="950" y="391.3" font-size="14" font-weight="400" fill="#6b6b6b" text-anchor="middle">your voice over graphics</text>
  <path d="M950,422 L950,452" fill="none" stroke="#d4600b" stroke-width="2.5" marker-end="url(#aaccent)"/>
  <rect x="790" y="456" width="320" height="64" rx="9" fill="#1f1f1f" stroke="#1f1f1f" stroke-width="0"/>
  <text x="950" y="493.4" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">asked for a default voice?</text>
  <path d="M786,488 L652,488 Q640,488 640,500 L640,546" fill="none" stroke="#1f1f1f" stroke-width="2" marker-end="url(#aink)"/>
  <text x="712" y="476" font-size="15" font-weight="700" fill="#1f1f1f" text-anchor="middle">yes</text>
  <rect x="520" y="550" width="240" height="40" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="640" y="574.5" font-size="15" font-weight="700" fill="#d4600b" text-anchor="middle">macOS say (Tingting)</text>
  <path d="M950,524 L950,546" fill="none" stroke="#d4600b" stroke-width="2.5" marker-end="url(#aaccent)"/>
  <text x="962" y="541" font-size="15" font-weight="700" fill="#d4600b">no</text>
  <rect x="824" y="544" width="252" height="52" rx="12" fill="#e9c9ae"/>
  <rect x="830" y="550" width="240" height="40" rx="9" fill="#fcefe5" stroke="#d4600b" stroke-width="2.5"/>
  <text x="950" y="574.5" font-size="15" font-weight="700" fill="#d4600b" text-anchor="middle">cloned voice, one take</text>
  <text x="40" y="440" font-size="13.5" font-weight="400" fill="#8a8a8a">Paid steps (voice, avatar) only run</text>
  <text x="40" y="459" font-size="13.5" font-weight="400" fill="#8a8a8a">after you approve the storyboard.</text>
</svg>
