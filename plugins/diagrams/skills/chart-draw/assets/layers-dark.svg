  <rect x="665.5" y="472" width="185.2" height="27" rx="13.5" fill="#2a2723" stroke="#aca69d" stroke-width="1.2"/>
  <text x="758.1" y="488" font-size="13" font-weight="700" fill="#aca69d" text-anchor="middle">Application Support/</text>
  <rect x="950" y="280" width="210" height="110" rx="10" fill="#2a2723" stroke="#ece8e1" stroke-width="2.5"/>
  <text x="1055" y="321.5" font-size="18" font-weight="700" fill="#ece8e1" text-anchor="middle">.claude/ links</text>
