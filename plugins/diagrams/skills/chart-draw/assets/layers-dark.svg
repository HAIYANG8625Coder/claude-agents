  <text x="1055" y="438" font-size="13.5" font-weight="400" fill="#8f8a82" text-anchor="middle">/x-assistant:x-post</text>
  <text x="40" y="572" font-size="13.5" font-weight="400" fill="#8f8a82">Each layer only points down: a plugin lists its skills; a skill reads its data folder.</text>
