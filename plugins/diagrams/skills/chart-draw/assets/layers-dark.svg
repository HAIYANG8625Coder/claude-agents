  <rect x="520.66" y="236" width="120.72" height="27" rx="13.5" fill="#2a2723" stroke="#aca69d" stroke-width="1.2"/>
  <text x="581.02" y="252" font-size="13" font-weight="700" fill="#aca69d" text-anchor="middle">avatar-video</text>
  <rect x="649.38" y="236" width="128.78" height="27" rx="13.5" fill="#2a2723" stroke="#aca69d" stroke-width="1.2"/>
