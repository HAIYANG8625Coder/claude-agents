<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ece8e1"/></marker><marker id="aaccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="agrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f6a63"/></marker></defs>
  <rect width="1200" height="640" fill="#0d1117"/>
  <text x="40" y="50" font-size="21" font-weight="700" fill="#ece8e1">Sequence · recording one voice take</text>
  <text x="40" y="76" font-size="13.5" font-weight="400" fill="#8f8a82">The HeyGen sign-in only works in the CLI, so the skill relays one call through a nested claude -p.</text>
  <rect x="60" y="104" width="220" height="76" rx="10" fill="#2a2723" stroke="#ece8e1" stroke-width="2.5"/>
  <text x="170" y="136.6" font-size="19" font-weight="700" fill="#ece8e1" text-anchor="middle">voice-video</text>
  <text x="170" y="165.3" font-size="14" font-weight="400" fill="#aca69d" text-anchor="middle">skill in your session</text>
  <line x1="170" y1="186" x2="170" y2="590" stroke="#4d4842" stroke-width="2" stroke-dasharray="3 7"/>
  <rect x="350" y="104" width="220" height="76" rx="9" fill="#2a2723" stroke="#4a4640" stroke-width="1.5"/>
  <text x="460" y="136.6" font-size="19" font-weight="700" fill="#f0883e" text-anchor="middle">heygen_take.sh</text>
  <text x="460" y="165.3" font-size="14" font-weight="400" fill="#aca69d" text-anchor="middle">shell script</text>
  <line x1="460" y1="186" x2="460" y2="590" stroke="#4d4842" stroke-width="2" stroke-dasharray="3 7"/>
  <rect x="634" y="98" width="232" height="88" rx="12" fill="#6b4024"/>
  <rect x="640" y="104" width="220" height="76" rx="9" fill="#3d2616" stroke="#f0883e" stroke-width="2.5"/>
  <text x="750" y="136.6" font-size="19" font-weight="700" fill="#f0883e" text-anchor="middle">claude -p</text>
  <text x="750" y="165.3" font-size="14" font-weight="400" fill="#aca69d" text-anchor="middle">nested · Sonnet</text>
  <line x1="750" y1="186" x2="750" y2="590" stroke="#4d4842" stroke-width="2" stroke-dasharray="3 7"/>
  <rect x="930" y="104" width="220" height="76" rx="9" fill="#ece8e1" stroke="#ece8e1" stroke-width="0"/>
  <text x="1040" y="136.6" font-size="19" font-weight="700" fill="#2a2723" text-anchor="middle">HeyGen</text>
  <text x="1040" y="165.3" font-size="14" font-weight="400" fill="#5b5751" text-anchor="middle">MCP server</text>
  <line x1="1040" y1="186" x2="1040" y2="590" stroke="#4d4842" stroke-width="2" stroke-dasharray="3 7"/>
  <path d="M178,240 L450,240" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#aaccent)"/>
  <text x="315" y="228" font-size="15" font-weight="700" fill="#f0883e" text-anchor="middle">1. run with the video folder</text>
  <path d="M468,300 L740,300" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#aaccent)"/>
  <text x="605" y="288" font-size="15" font-weight="700" fill="#f0883e" text-anchor="middle">2. call create_speech once</text>
  <path d="M758,360 L1030,360" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#aaccent)"/>
  <text x="895" y="348" font-size="15" font-weight="700" fill="#f0883e" text-anchor="middle">3. the whole script, one take</text>
  <path d="M1032,420 L760,420" fill="none" stroke="#6f6a63" stroke-width="2" stroke-dasharray="10 7" marker-end="url(#agrey)"/>
  <text x="895" y="408" font-size="15" font-weight="400" fill="#aca69d" text-anchor="middle">audio URL + word timestamps</text>
  <path d="M742,480 L470,480" fill="none" stroke="#6f6a63" stroke-width="2" stroke-dasharray="10 7" marker-end="url(#agrey)"/>
  <text x="605" y="468" font-size="15" font-weight="400" fill="#aca69d" text-anchor="middle">full.raw + words.json saved</text>
  <path d="M452,540 L180,540" fill="none" stroke="#6f6a63" stroke-width="2" stroke-dasharray="10 7" marker-end="url(#agrey)"/>
  <text x="315" y="528" font-size="15" font-weight="400" fill="#aca69d" text-anchor="middle">take ok</text>
  <rect x="780" y="440" width="200" height="66" rx="9" fill="#2a2723" stroke="#6f6a63" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="880" y="467.075" font-size="14" font-weight="700" fill="#aca69d" text-anchor="middle">Telegram plugin off</text>
  <text x="880" y="489.275" font-size="12.5" font-weight="400" fill="#aca69d" text-anchor="middle">so it can't steal the bot</text>
  <text x="40" y="622" font-size="13.5" font-weight="400" fill="#8f8a82">Orange: requests, numbered in order. Grey dashed: replies.</text>
</svg>
