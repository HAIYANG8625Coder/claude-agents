<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ece8e1"/></marker><marker id="aaccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="agrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f6a63"/></marker></defs>
  <rect width="1200" height="520" fill="#0d1117"/>
  <text x="40" y="50" font-size="21" font-weight="700" fill="#ece8e1">Compare · letting a background job read its files</text>
  <rect x="40" y="80" width="540" height="400" rx="14" fill="#1c1a17"/>
  <rect x="70" y="104" width="480" height="86" rx="9" fill="#2a2723" stroke="#3d3934" stroke-width="1.5"/>
  <text x="310" y="142.2" font-size="21" font-weight="700" fill="#7f7a72" text-anchor="middle">A · Full Disk Access</text>
  <text x="310" y="173.5" font-size="14" font-weight="400" fill="#7f7a72" text-anchor="middle">for Python, in System Settings</text>
  <text x="86" y="238" font-size="22" font-weight="700" fill="#3fb950">✓</text>
  <text x="122" y="237" font-size="16" font-weight="400" fill="#aca69d">repo stays where it is</text>
  <text x="86" y="290" font-size="22" font-weight="700" fill="#f85149">✗</text>
  <text x="122" y="289" font-size="16" font-weight="400" fill="#aca69d">every Python script can read every file</text>
  <text x="86" y="342" font-size="22" font-weight="700" fill="#f85149">✗</text>
  <text x="122" y="341" font-size="16" font-weight="400" fill="#aca69d">a security setting only you can change</text>
  <text x="86" y="394" font-size="22" font-weight="700" fill="#f85149">✗</text>
  <text x="122" y="393" font-size="16" font-weight="400" fill="#aca69d">still blocked: it checks the /usr/bin shim</text>
  <rect x="620" y="80" width="540" height="400" rx="14" fill="#1c1a17"/>
  <rect x="644" y="98" width="492" height="98" rx="12" fill="#6b4024"/>
  <rect x="650" y="104" width="480" height="86" rx="9" fill="#3d2616" stroke="#f0883e" stroke-width="2.5"/>
  <text x="890" y="142.2" font-size="21" font-weight="700" fill="#f0883e" text-anchor="middle">B · Move out of ~/Documents</text>
  <text x="890" y="173.5" font-size="14" font-weight="400" fill="#aca69d" text-anchor="middle">~/Library/Application Support/stats-agent</text>
  <text x="666" y="238" font-size="22" font-weight="700" fill="#3fb950">✓</text>
  <text x="702" y="237" font-size="16" font-weight="400" fill="#ece8e1">no special access at all</text>
  <text x="666" y="290" font-size="22" font-weight="700" fill="#3fb950">✓</text>
  <text x="702" y="289" font-size="16" font-weight="400" fill="#ece8e1">the job sees only its own folder</text>
  <text x="666" y="342" font-size="22" font-weight="700" fill="#3fb950">✓</text>
  <text x="702" y="341" font-size="16" font-weight="400" fill="#ece8e1">worked on the first launchd run</text>
  <text x="666" y="394" font-size="22" font-weight="700" fill="#f85149">✗</text>
  <text x="702" y="393" font-size="16" font-weight="400" fill="#ece8e1">posts.md gets the numbers via /xhs-post</text>
  <rect x="650" y="436" width="72.36" height="27" rx="13.5" fill="#ece8e1" stroke="#2a2723" stroke-width="1.2"/>
  <text x="686.18" y="452" font-size="13" font-weight="700" fill="#2a2723" text-anchor="middle">chosen</text>
  <path d="M586,280 L614,280" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#aaccent)"/>
  <text x="40" y="506" font-size="13.5" font-weight="400" fill="#8f8a82">Show the option you rejected too: readers trust a choice more when they see what it beat.</text>
</svg>
