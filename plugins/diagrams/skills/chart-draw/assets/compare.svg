<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker><marker id="aaccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d4600b"/></marker><marker id="agrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8a49c"/></marker></defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="40" y="50" font-size="21" font-weight="700" fill="#1f1f1f">Compare · letting a background job read its files</text>
  <rect x="40" y="80" width="540" height="400" rx="14" fill="#f0ede6"/>
  <rect x="70" y="104" width="480" height="86" rx="9" fill="#ffffff" stroke="#e3dfd7" stroke-width="1.5"/>
  <text x="310" y="142.2" font-size="21" font-weight="700" fill="#9a968e" text-anchor="middle">A · Full Disk Access</text>
  <text x="310" y="173.5" font-size="14" font-weight="400" fill="#9a968e" text-anchor="middle">for Python, in System Settings</text>
  <text x="86" y="238" font-size="22" font-weight="700" fill="#1e7a3c">✓</text>
  <text x="122" y="237" font-size="16" font-weight="400" fill="#6b6b6b">repo stays where it is</text>
  <text x="86" y="290" font-size="22" font-weight="700" fill="#c23b22">✗</text>
  <text x="122" y="289" font-size="16" font-weight="400" fill="#6b6b6b">every Python script can read every file</text>
  <text x="86" y="342" font-size="22" font-weight="700" fill="#c23b22">✗</text>
  <text x="122" y="341" font-size="16" font-weight="400" fill="#6b6b6b">a security setting only you can change</text>
  <text x="86" y="394" font-size="22" font-weight="700" fill="#c23b22">✗</text>
  <text x="122" y="393" font-size="16" font-weight="400" fill="#6b6b6b">still blocked: it checks the /usr/bin shim</text>
  <rect x="620" y="80" width="540" height="400" rx="14" fill="#f0ede6"/>
  <rect x="644" y="98" width="492" height="98" rx="12" fill="#e9c9ae"/>
  <rect x="650" y="104" width="480" height="86" rx="9" fill="#fcefe5" stroke="#d4600b" stroke-width="2.5"/>
  <text x="890" y="142.2" font-size="21" font-weight="700" fill="#d4600b" text-anchor="middle">B · Move out of ~/Documents</text>
  <text x="890" y="173.5" font-size="14" font-weight="400" fill="#6b6b6b" text-anchor="middle">~/Library/Application Support/stats-agent</text>
  <text x="666" y="238" font-size="22" font-weight="700" fill="#1e7a3c">✓</text>
  <text x="702" y="237" font-size="16" font-weight="400" fill="#1f1f1f">no special access at all</text>
  <text x="666" y="290" font-size="22" font-weight="700" fill="#1e7a3c">✓</text>
  <text x="702" y="289" font-size="16" font-weight="400" fill="#1f1f1f">the job sees only its own folder</text>
  <text x="666" y="342" font-size="22" font-weight="700" fill="#1e7a3c">✓</text>
  <text x="702" y="341" font-size="16" font-weight="400" fill="#1f1f1f">worked on the first launchd run</text>
  <text x="666" y="394" font-size="22" font-weight="700" fill="#c23b22">✗</text>
  <text x="702" y="393" font-size="16" font-weight="400" fill="#1f1f1f">posts.md gets the numbers via /xhs-post</text>
  <rect x="650" y="436" width="72.36" height="27" rx="13.5" fill="#1f1f1f" stroke="#ffffff" stroke-width="1.2"/>
  <text x="686.18" y="452" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">chosen</text>
  <path d="M586,280 L614,280" fill="none" stroke="#d4600b" stroke-width="2.5" marker-end="url(#aaccent)"/>
  <text x="40" y="506" font-size="13.5" font-weight="400" fill="#8a8a8a">Show the option you rejected too: readers trust a choice more when they see what it beat.</text>
</svg>
