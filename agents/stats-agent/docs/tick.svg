<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d4600b"/></marker>
  </defs>
  <rect width="1200" height="860" fill="#ffffff"/>

  <!-- inputs -->
  <text x="300" y="70" text-anchor="end" font-size="20" fill="#555">A timer is due</text>
  <text x="300" y="132" text-anchor="end" font-size="20" fill="#555">You run event check</text>
  <line x1="312" y1="64" x2="436" y2="86" stroke="#1f1f1f" stroke-width="2.5" marker-end="url(#ak)"/>
  <line x1="312" y1="126" x2="436" y2="110" stroke="#1f1f1f" stroke-width="2.5" marker-end="url(#ak)"/>

  <!-- scheduler / handler -->
  <rect x="440" y="40" width="380" height="110" rx="16" fill="#ffffff" stroke="#1f1f1f" stroke-width="3"/>
  <text x="630" y="88" text-anchor="middle" font-size="26" font-weight="700" fill="#1f1f1f">Scheduler / handler</text>
  <text x="630" y="122" text-anchor="middle" font-size="19" fill="#555">every tick (launchd, 10 min)</text>

  <!-- 1 write -->
  <line x1="740" y1="152" x2="740" y2="232" stroke="#d4600b" stroke-width="5" marker-end="url(#ao)"/>
  <text x="760" y="200" font-size="22" font-weight="700" fill="#d4600b">1. Write the event</text>

  <!-- inbox table -->
  <rect x="300" y="240" width="860" height="350" rx="20" fill="#f0ede6"/>
  <text x="330" y="288" font-size="30" font-weight="700" fill="#d4600b">Event inbox</text>
  <text x="520" y="288" font-size="20" fill="#555">SQLite table</text>
  <text x="345" y="334" font-size="18" font-weight="700" fill="#555">When</text>
  <text x="500" y="334" font-size="18" font-weight="700" fill="#555">What happened</text>
  <text x="1120" y="334" text-anchor="end" font-size="18" font-weight="700" fill="#555">Status</text>

  <rect x="322" y="350" width="816" height="56" rx="10" fill="#ffffff" stroke="#dedad2" stroke-width="2"/>
  <text x="345" y="386" font-size="19" fill="#555">Sun 10:12</text>
  <text x="500" y="386" font-size="19" fill="#1f1f1f">check · you asked for the numbers</text>
  <text x="1120" y="386" text-anchor="end" font-size="19" fill="#8a8a8a">done</text>

  <rect x="322" y="418" width="816" height="56" rx="10" fill="none" stroke="#a8a49c" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="345" y="454" font-size="19" fill="#9a968e">Sun 10:12</text>
  <text x="500" y="454" font-size="19" fill="#9a968e">Same check again, same ID</text>
  <text x="1120" y="454" text-anchor="end" font-size="19" fill="#9a968e">dropped</text>

  <rect x="322" y="486" width="816" height="88" rx="10" fill="#ffffff" stroke="#d4600b" stroke-width="3"/>
  <text x="345" y="520" font-size="19" fill="#555">Mon 10:08</text>
  <text x="500" y="520" font-size="19" fill="#1f1f1f">follow-up · a new note reached 24 h</text>
  <text x="1120" y="520" text-anchor="end" font-size="19" font-weight="700" fill="#d4600b">pending</text>
  <line x1="345" y1="532" x2="1115" y2="532" stroke="#e6e2da" stroke-width="1.5"/>
  <text x="345" y="560" font-size="19" fill="#555">Mon 21:15</text>
  <text x="500" y="560" font-size="19" fill="#1f1f1f">schedule · the daily digest</text>
  <text x="1120" y="560" text-anchor="end" font-size="19" font-weight="700" fill="#d4600b">pending</text>

  <!-- 2 read, 5 mark done -->
  <line x1="380" y1="596" x2="380" y2="676" stroke="#d4600b" stroke-width="5" marker-end="url(#ao)"/>
  <text x="398" y="632" font-size="22" font-weight="700" fill="#d4600b">2. Read every</text>
  <text x="398" y="660" font-size="22" font-weight="700" fill="#d4600b">pending event</text>
  <line x1="640" y1="676" x2="640" y2="598" stroke="#d4600b" stroke-width="5" marker-end="url(#ao)"/>
  <text x="658" y="632" font-size="22" font-weight="700" fill="#d4600b">5. Mark done</text>

  <!-- worker, run -->
  <rect x="300" y="684" width="400" height="120" rx="16" fill="#ffffff" stroke="#1f1f1f" stroke-width="3"/>
  <text x="500" y="734" text-anchor="middle" font-size="28" font-weight="700" fill="#1f1f1f">Worker</text>
  <text x="500" y="770" text-anchor="middle" font-size="19" fill="#555">one at a time (file lock)</text>

  <rect x="900" y="684" width="260" height="120" rx="16" fill="#ffffff" stroke="#1f1f1f" stroke-width="3"/>
  <text x="1030" y="734" text-anchor="middle" font-size="28" font-weight="700" fill="#1f1f1f">Run</text>
  <text x="1030" y="770" text-anchor="middle" font-size="19" fill="#555">claude -p, allow-list</text>

  <line x1="706" y1="722" x2="890" y2="722" stroke="#d4600b" stroke-width="5" marker-end="url(#ao)"/>
  <text x="799" y="704" text-anchor="middle" font-size="19" font-weight="700" fill="#d4600b">3. One run for all</text>
  <line x1="896" y1="766" x2="710" y2="766" stroke="#d4600b" stroke-width="5" marker-end="url(#ao)"/>
  <text x="803" y="798" text-anchor="middle" font-size="19" font-weight="700" fill="#d4600b">4. Wait for its JSON</text>

  <!-- 6 results -->
  <path d="M300,744 H120 Q100,744 100,724 V420" fill="none" stroke="#d4600b" stroke-width="3" stroke-dasharray="11 8" marker-end="url(#ao)"/>
  <text x="40" y="360" font-size="21" font-weight="700" fill="#d4600b">6. Follow-ups</text>
  <text x="40" y="388" font-size="21" font-weight="700" fill="#d4600b">→ timers,</text>
  <text x="40" y="416" font-size="21" font-weight="700" fill="#d4600b">message → outbox</text>

  <!-- quiet path -->
  <text x="40" y="200" font-size="17" fill="#8a8a8a">Nothing pending?</text>
  <text x="40" y="224" font-size="17" fill="#8a8a8a">The tick ends here:</text>
  <text x="40" y="248" font-size="17" fill="#8a8a8a">no model, no tokens.</text>
  <text x="40" y="836" font-size="17" fill="#8a8a8a">A failed run leaves its events pending for the next tick. After 3 failures they are marked failed and you get a Telegram warning.</text>
</svg>
